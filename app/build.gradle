plugins {
    alias(libs.plugins.android.application)
}

// The release key stays outside the repo. keystore.properties (not committed) points to it
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    namespace = 'me.sectiontn.ondes'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId = 'me.sectiontn.ondes'
        minSdk = 24
        targetSdk = 37
        versionCode = 2
        versionName = '1.1'
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Lists English and French in the system's per-app language setting (Android 13 and newer)
    androidResources {
        generateLocaleConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    implementation libs.retrofit
    implementation libs.retrofit.gson
    implementation libs.okhttp
    implementation libs.media3.exoplayer
    implementation libs.media3.exoplayer.hls
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler
    implementation libs.glide

    testImplementation libs.junit
}
